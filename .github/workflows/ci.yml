# CI — PDF Editor
#
# Three verification gates, each independently runnable:
#   1. swift-gate:    swift test + swift build -c release
#   2. node-contract: Pure-Node contract tests (no external tool dependencies)
#   3. web-e2e:       Playwright browser tests via Tests/run-web-e2e.mjs
#
# Evidence linked to release-gates.md RG-081.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly heavy gate: full 4-provider OCR WER regression check.
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Swift ────────────────────────────────────────────────────
  swift-gate:
    name: Swift test + release build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest available Xcode on the runner.
          # (Glob must match the .app bundle; Xcode_*.xcodeproj never matches,
          #  which silently left the runner's default — older — toolchain
          #  selected and failed builds using Swift 6.1+ syntax. Fix 2026-09-14.)
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
            echo "Selected: $(basename "$XCODE_APP")"
          fi
          swift --version
          xcrun --show-sdk-path

      # pdf-lib AcroForm lane: the parity experiment's independent provider
      # engine (pure-JS). Without it the pdf-lib rows cannot be measured and
      # the cross-provider gate fails closed. node is preinstalled on macOS
      # runners; pdf-lib has no native deps.
      - name: Install pdf-lib AcroForm lane
        run: npm ci --prefix benchmark/acroform-lane 2>&1

      - name: Swift test
        run: swift test 2>&1

      # Detector measurement gate: run the live native candidate pipeline
      # against the reviewed ground truth. Fails the job non-zero on any
      # detection regression (also enforced in-process by
      # NativeDetectorGateTests above).
      - name: Detector gate (native candidate pipeline)
        run: |
          swift run PDFContractHarness \
            --manifest docs/fixtures/corpus-sweep-detector-manifest.md \
            --output-dir benchmark/results/detector-calibration/native-corpus \
            --detector-gate 2>&1

      # Dual-lane detector gate: run both native and browser lanes against
      # the reviewed ground truth. Fails the job non-zero when either lane
      # regresses on any fixture.
      - name: Dual-lane detector gate (native + browser)
        run: |
          swift run PDFContractHarness \
            --manifest docs/fixtures/corpus-sweep-detector-manifest.md \
            --output-dir benchmark/results/detector-calibration/native-corpus \
            --dual-lane-gate 2>&1

      # Calibration artifact gate: explicitly regenerates the LayoutFingerprintV2
      # calibration artifact by running the F-3 threshold calibration test,
      # then validates the persisted JSON against expected invariants.
      # Fails non-zero on: test failure, schema mismatch, threshold drift,
      # positive recognition collapse, hard-negative promotion, or corpus regression.
      - name: Calibration gate (regenerate + validate 60-fixture corpus)
        run: scripts/calibration-gate.sh 2>&1

      # RG-139 raster blend-sweep gate: reruns the permanent blend gate suite
      # (fresh regeneration — the report is a product of this run, not a
      # committed file) and validates the persisted JSON invariants. Fails on:
      #   - Test failure (a gated blend no longer separates)
      #   - Schema mismatch or missing report
      #   - Either gated blend (95/3/2 shipped, 85/8/7 target) dropping below
      #     the ratified 0.90 family threshold
      #   - Any evidence-bearing hard-negative promotion (RG-138 evidence floor)
      #   - Corpus shrinkage below the 50-fixture floor
      # See docs/release-gates.md RG-139; suite:
      # Tests/PDFEditorCoreTests/RasterBlendCalibrationGateTests.swift.
      - name: Raster blend gate (RG-139)
        run: |
          swift test --filter RasterBlendCalibrationGate 2>&1
          python3 - <<'PY'
          import json, sys, pathlib

          report = pathlib.Path('benchmark/results/raster-blend-gate/raster-blend-gate-report.json')
          if not report.exists():
              print('::error::RG-139 raster blend gate report not found')
              sys.exit(1)
          data = json.load(open(report))
          if data.get('schema') != 'pdf-editor.raster-blend-gate':
              print(f"::error::Unexpected schema: {data.get('schema')}")
              sys.exit(1)
          # Corpus floor: the gate test requires >= 50 of the 56-fixture F-3
          # corpus to extract. A silently shrunken corpus must not pass.
          corpus = data.get('corpusSize', 0)
          if corpus < 50:
              print(f'::error::Blend gate corpus too small: {corpus} fixtures (floor: 50)')
              sys.exit(1)
          blends = data.get('blends', [])
          if not blends:
              print('::error::Blend gate report contains no blend rows')
              sys.exit(1)
          if not data.get('gatePassed', False):
              print('::error::RG-139 gatePassed=false — a gated blend row regressed')
              sys.exit(1)
          for b in blends:
              label = b.get('label', '?')
              min_pos = b.get('minPositive', 0)
              promotions = b.get('evidencePromotions', [])
              print(f"  {label}: minPos={min_pos:.4f} ev-promotions={len(promotions)} abstentions={b.get('abstentions', 0)}")
              if min_pos < 0.90:
                  print(f"::error::{label}: minPositive {min_pos:.4f} < 0.90 — positive recognition collapsed (worst: {b.get('worstPositivePair')})")
                  sys.exit(1)
              if promotions:
                  print(f"::error::{label}: evidence-bearing hard negatives promoted: {promotions[:4]}")
                  sys.exit(1)
          print('Raster blend gate (RG-139) passed: 95/3/2 and 85/8/7 hold the 0.90 separation.')
          PY

      # Manifest field presence gate: verifies every corpus-sweep fixture's
      # structural expectations (widget count, annotation count, page count)
      # match live PDFKit inspection. Catches name-vs-structure inference
      # errors (the original class of bug where fixture expectations were
      # inferred from filenames rather than actual PDF structure).
      - name: Manifest field presence gate
        run: |
          swift test --filter ManifestFieldPresenceGate 2>&1

      # AcroForm parity gate: runs the cross-provider AcroForm parity
      # experiment against the governed corpus. Verifies the persisted
      # gate report exists, has the correct schema, and records per-type
      # capability decisions. Fails on unexpected regression.
      - name: AcroForm parity gate
        run: |
          swift test --filter AcroFormParityExperiment 2>&1
          python3 - <<'PY'
          import json, sys, pathlib

          report = pathlib.Path('benchmark/results/acroform-parity/acroform-parity-gate-report.json')
          if not report.exists():
              print('::error::AcroForm parity gate report not found')
              sys.exit(1)
          data = json.load(open(report))
          if data.get('schema') != 'pdf-editor.acroform-parity-experiment':
              print(f'::error::Unexpected schema: {data.get("schema")}')
              sys.exit(1)
          # Corpus-size floor (2026-09-06, epistemic audit N14): the parity
          # claim is corpus-dependent; a report from a silently shrunken
          # corpus must not pass. 40 = current governed AcroForm corpus
          # (RG-134 closure). Raise deliberately, never let it shrink.
          corpus_size = data.get('corpusSize', 0)
          if corpus_size < 40:
              print(f'::error::Parity corpus too small: {corpus_size} fixtures (floor: 40)')
              sys.exit(1)
          for ft in data.get('fieldTypes', []):
              decision = ft.get('decision', '')
              print(f"  {ft['fieldType']}: {decision} (agree={ft['crossProviderAgreement']:.2f} rt={ft['roundTripSuccessRate']:.2f} ghost={ft['ghostFields']})")
          # CI gate (updated 2026-09-06, RG-134 closure): checkbox, choice, and
          # text are production_ready on the 40-fixture corpus (all round-trip
          # 1.000). The former 'some non-synthetic PDFs don't preserve checkbox
          # values through PDFKit save/reopen' premise was FALSIFIED — those
          # failures were measurement artifacts (see
          # docs/audits/rg134-checkbox-closure-2026-09-06.md). CI therefore now
          # fails on any of the three types regressing below production_ready,
          # matching the RG-133 falsifier in docs/release-gates.md. Radio is
          # reported but not gated (Mixed: pdf-lib production-ready, PDFKit/
          # IncrementalWriter experimental with documented reasons).
          PROD_READY_TYPES = ('checkbox', 'choice', 'text')
          by_type = {f.get('fieldType'): f for f in data.get('fieldTypes', [])}
          missing = [t for t in PROD_READY_TYPES if t not in by_type]
          if missing:
              print(f'::error::Parity report missing field types: {missing}')
              sys.exit(1)
          failed = []
          for t in PROD_READY_TYPES:
              ft = by_type[t]
              rt_rate = ft.get('roundTripSuccessRate', 0)
              if rt_rate < 0.5:
                  failed.append(f'{t} round-trip rate {rt_rate:.0%} below 50% threshold')
              if ft.get('decision') != 'All providers production-ready for ' + t:
                  failed.append(f'{t} is "{ft.get("decision")}" (rt={rt_rate:.0%}) — regression vs production_ready')
              print(f"  {t}: {ft.get('decision')} (rt={rt_rate:.0%})")
          radio = by_type.get('radio')
          if radio:
              print(f"  radio: {radio.get('decision')} (rt={radio.get('roundTripSuccessRate', 0):.0%}) [not gated]")
          if failed:
              for f_ in failed:
                  print(f'::error::{f_}')
              sys.exit(1)
          print('AcroForm parity gate passed (checkbox/choice/text production-ready).')
          PY

      # RG-135: human visual confirmation gate. CI has no human reviewer, so
      # this step validates the ledger/gate-report artifacts produced by the
      # reviewer panel and enforces what can be automated:
      #   - schema integrity of both artifacts
      #   - status 'fail' (a reviewer recorded a failure on current bytes) blocks
      #   - status 'pending' (coverage incomplete) is advisory in CI; the
      #     release disposition (docs/release-gates.md RG-135) requires 'pass'
      #     before version bumps
      - name: Human review gate (RG-135)
        run: |
          swift test --filter HumanVisualConfirmation 2>&1
          python3 - <<'PY'
          import json, sys, pathlib

          report_path = pathlib.Path('benchmark/results/human-visual-confirmation/human-review-gate-report.json')
          ledger_path = pathlib.Path('benchmark/results/human-visual-confirmation/human-review-ledger.json')

          # Both artifacts must exist (the test suite writes them via writeGateReport).
          if not report_path.exists():
              print('::error::RG-135 human-review gate report not found')
              sys.exit(1)
          if not ledger_path.exists():
              print('::error::RG-135 human-review ledger not found')
              sys.exit(1)

          report = json.load(open(report_path))
          if report.get('schema') != 'pdf-editor.human-review-gate':
              print(f"::error::RG-135 unexpected gate-report schema: {report.get('schema')}")
              sys.exit(1)

          ledger = json.load(open(ledger_path))
          if ledger.get('schema') != 'pdf-editor.human-visual-confirmation':
              print(f"::error::RG-135 unexpected ledger schema: {ledger.get('schema')}")
              sys.exit(1)

          total = report.get('totalFixtures', 0)
          confirmed = report.get('confirmedCount', 0)
          status = report.get('status', '')
          print(f"RG-135 gate: {status} ({confirmed}/{total} human-confirmed)")

          if status == 'fail':
              failed = report.get('failedFixtures', [])
              print(f"::error::RG-135: reviewer recorded failures on current bytes: {', '.join(failed)}")
              sys.exit(1)
          if status == 'pending':
              pending = report.get('pendingFixtures', [])
              stale = report.get('staleFixtures', [])
              print(f"::warning::RG-135 pending: {len(pending)} fixture(s) unreviewed, {len(stale)} stale (release requires pass per docs/release-gates.md RG-135)")
          print('Human review gate (RG-135) satisfied for CI.')
          PY

      - name: Upload acroform parity gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acroform-parity-gate
          path: benchmark/results/acroform-parity/acroform-parity-gate-report.json
          if-no-files-found: error

      - name: Upload raster blend gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-blend-gate
          path: benchmark/results/raster-blend-gate/raster-blend-gate-report.json
          if-no-files-found: error

      - name: Upload human-review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-visual-confirmation
          path: |
            benchmark/results/human-visual-confirmation/human-review-ledger.json
            benchmark/results/human-visual-confirmation/human-review-gate-report.json
          if-no-files-found: error

      # RG-136: cross-provider OCR WER regression gate (fast lane). Runs the
      # benchmark (Tesseract + Apple Vision — always available on the runner)
      # against the persisted baseline and fails on WER regression beyond
      # tolerance or above the absolute per-provider threshold. PaddleOCR and
      # Marker are gated in the heavy lane below (they need the datasets venv
      # with paddleocr + marker-pdf installed); when absent here they are
      # recorded as not_ran provenance, never folded into a pass.
      - name: OCR WER regression gate (RG-136 fast lane)
        run: |
          swift build --product PDFVisionOCRCLI
          swift test --filter OCRWerGate 2>&1
          # tesseract is preinstalled on macos-15 images; .venv is gitignored.
          if [ ! -x .venv/bin/python ]; then python3 -m venv .venv; fi
          .venv/bin/pip install --quiet pytesseract pillow || true
          .venv/bin/python benchmark/compare_ocr_wer.py --gate --providers "Tesseract,Vision"

      - name: Upload OCR WER gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-wer-gate
          path: |
            benchmark/results/ocr-corpus/ocr-wer-baseline.json
            benchmark/results/ocr-corpus/ocr-wer-gate-report.json
            benchmark/results/ocr-corpus/cross-provider-wer-report.json
          if-no-files-found: warn

  # ── Gate 6: OCR WER heavy lane (all four providers) ───────────────────
  # RG-136 heavy lane: runs the full cross-provider benchmark (Tesseract,
  # Apple Vision, PaddleOCR, Marker) against the same persisted baseline.
  # PaddleOCR carries the 0.10 absolute threshold since the 2026-09-11
  # re-baseline (reading-order post-processing collapsed the multi-column
  # outlier 0.7297 → 0.0000; measured avg 0.0179 — see
  # docs/audits/ocr-cross-provider-benchmark-2026-09-01.md §2026-09-11).
  # Marker is gated on regression-vs-baseline ONLY (its corpus average
  # reflects markdown-conversion design, not a defect — see
  # GATE_REGRESSION_ONLY_PROVIDERS in benchmark/compare_ocr_wer.py). Runs nightly and on manual dispatch
  # because installing paddleocr + marker-pdf + torch on a fresh runner is
  # heavy; a provider that fails to run is recorded as not_ran provenance and
  # never fails the gate, so a broken install cannot cause a false pass.
  ocr-wer-heavy:
    name: OCR WER heavy gate (4 providers)
    runs-on: macos-15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Same glob defect as the main job's Select Xcode (fixed in the
          # b5720d3 pass): Xcode_*.xcodeproj never matches .app bundles, so
          # this silently kept the runner's default toolchain selected.
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
            echo "Selected: $(basename "$XCODE_APP")"
          fi

      - name: Build Vision CLI
        run: swift build --product PDFVisionOCRCLI 2>&1

      - name: Install heavy OCR providers (best-effort; absence = not_ran provenance)
        run: |
          if [ ! -x benchmark/datasets/.venv/bin/python ]; then
            python3 -m venv benchmark/datasets/.venv
          fi
          benchmark/datasets/.venv/bin/pip install --quiet \
            pytesseract pillow paddleocr marker-pdf || true
          benchmark/datasets/.venv/bin/python -c "import paddleocr" 2>/dev/null && echo "paddleocr ok" || echo "paddleocr unavailable"
          benchmark/datasets/.venv/bin/python -c "import marker" 2>/dev/null && echo "marker ok" || echo "marker unavailable"

      - name: Run full 4-provider WER gate
        run: |
          swift test --filter OCRWerGate 2>&1
          benchmark/datasets/.venv/bin/python benchmark/compare_ocr_wer.py --gate

      - name: Upload heavy OCR gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-wer-heavy
          path: |
            benchmark/results/ocr-corpus/ocr-wer-baseline.json
            benchmark/results/ocr-corpus/ocr-wer-gate-report.json
            benchmark/results/ocr-corpus/cross-provider-wer-report.json
          if-no-files-found: warn

      # Static artifact validation: the Swift test suite regenerates the
      # persisted false-positive report. Verify it exists and passes.
      - name: False-positive report gate
        run: |
          python3 - <<'PY'
          import json, sys, pathlib

          errors = []
          fp_path = pathlib.Path('benchmark/results/recurring-form-calibration/recurring-form-calibration-report-2026-08-28.json')
          if not fp_path.exists():
              errors.append(f'False-positive report not found at {fp_path}')
          else:
              fp = json.load(open(fp_path))
              c = fp['calibration']
              if fp.get('schema') != 'pdf-editor.recurring-form-calibration-report':
                  errors.append(f'FP schema is {fp.get("schema")}')
              if fp['thresholds'].get('familyThreshold') != 0.90:
                  errors.append(f'familyThreshold is {fp["thresholds"]["familyThreshold"]}, expected 0.90')
              if c.get('falsePositives', 0) > 0:
                  errors.append(f'False positives: {c["falsePositives"]}')
              if c.get('accuracy', 0) < 1.0:
                  errors.append(f'Accuracy dropped to {c["accuracy"]}')
              print(f'FP report: {c["passed"]}/{c["passed"]+c["failed"]} entries, FP={c["falsePositives"]}, FN={c["falseNegatives"]}, accuracy={c["accuracy"]}')

          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('False-positive report gate passed.')
          PY

      - name: Swift release build
        run: swift build -c release 2>&1

  # ── Gate 2: Node contract tests (no browser, no external tools) ─────
  node-contract:
    name: Node contract tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run contract tests
        run: |
          PASSED=0
          FAILED=0
          ERRORS=""

          # Core contract/mutation tests (zero external tool dependencies).
          # Coverage note (2026-09-06 exploration): 54 of the 88 contract
          # tests classify as pure-Node; this gate runs 35 of them. The rest
          # are excluded deliberately: 34 browser-classified tests run in the
          # web-e2e job; tool-dependent tests (qpdf/mutool/pikepdf: sanitize,
          # guards, corpus sweeps, mupdf, OCR comparison) run in the
          # tool-dependent job; Tests/browser_export_independent_viewer_validator_test.mjs
          # and Tests/pdf-source-preserving-lane_test.mjs need built lanes and
          # are tracked in docs/explorations/features-flows-loops-exploration-2026-09-06.md §8.
          CORE_TESTS=(
            Tests/web_reader_contract_test.mjs
            Tests/pdf_contract_parity_mutation_test.mjs
            Tests/pdf_capability_lanes_test.mjs
            Tests/pdf_object_preservation_test.mjs
            Tests/pdf_write_planning_test.mjs
            Tests/operation_history_test.mjs
            Tests/candidate_parity_mutation_test.mjs
            Tests/evidence_fusion_test.mjs
            Tests/template_index_test.mjs
            Tests/template_profile_migration_test.mjs
            Tests/template_match_native_browser_parity_test.mjs
            Tests/web_template_contract_test.mjs
            Tests/web_template_store_test.mjs
            Tests/web_template_sync_test.mjs
            Tests/web_template_match_benchmark_test.mjs
            Tests/web_template_correction_benchmark_test.mjs
            Tests/preflight_contract_test.mjs
            Tests/provenance_contract_test.mjs
            Tests/session_privacy_provenance_test.mjs
            Tests/reviewed_completion_metrics_mutation_test.mjs
            Tests/provider_capability_contract_test.mjs
            Tests/provider_companion_host_test.mjs
            Tests/provider_companion_protocol_test.mjs
            Tests/text_run_ocr_alignment_contract_test.mjs
            Tests/pdf_ua_validator_test.mjs
            Tests/browser_resource_policy_test.mjs
            Tests/native_browser_fingerprint_parity_test.mjs
            Tests/native_browser_semantic_parity_report_test.mjs
            Tests/native_browser_candidate_parity_report_test.mjs
            Tests/capability-matrix-parity_test.mjs
            Tests/export_page_fact_replay_test.mjs
            Tests/moat_asset_registry_test.mjs
            Tests/multi_engine_conformance_test.mjs
            Tests/provider_rejection_ledger_oracle_test.mjs
            Tests/web_preexport_privacy_gate_test.mjs
          )

          for test in "${CORE_TESTS[@]}"; do
            if [ -f "$test" ]; then
              if node "$test" 2>&1; then
                PASSED=$((PASSED + 1))
              else
                FAILED=$((FAILED + 1))
                ERRORS="$ERRORS\n  FAIL: $test"
              fi
            fi
          done

          echo ""
          echo "Node contract gate: $PASSED passed, $FAILED failed"
          if [ "$FAILED" -gt 0 ]; then
            echo -e "Failures:$ERRORS"
            exit 1
          fi

  # ── Gate 3: Playwright browser E2E ───────────────────────────────────
  web-e2e:
    name: Playwright browser E2E
    runs-on: macos-15
    needs: [swift-gate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run browser E2E suite
        run: node Tests/run-web-e2e.mjs

  # ── Gate 4: External-tool-dependent tests ────────────────────────────
  tool-dependent:
    name: Tool-dependent tests (graceful skip)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tools
        run: |
          # qpdf and poppler for PDF structural/text validation
          brew install qpdf poppler || true
          # pikepdf for Python PDF manipulation
          pip3 install pikepdf || true

      - name: Run tool-dependent tests
        run: node Tests/run-tool-dependent-tests.mjs

  # ── Gate 5: React Doctor (security, performance, a11y, bundle) ────
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: millionco/react-doctor@v2
        with:
          directory: web/app

  # ── Evidence summary ─────────────────────────────────────────────────
  ci-evidence:
    name: CI evidence gate
    runs-on: ubuntu-latest
    needs: [swift-gate, node-contract, web-e2e, tool-dependent, react-doctor, ocr-wer-heavy]
    if: always()
    steps:
      - name: Evaluate gates
        run: |
          echo "Swift gate:        ${{ needs.swift-gate.result }}"
          echo "Node contract:     ${{ needs.node-contract.result }}"
          echo "Web E2E:           ${{ needs.web-e2e.result }}"
          echo "Tool-dependent:    ${{ needs.tool-dependent.result }}"
          echo "React Doctor:      ${{ needs.react-doctor.result }}"
          echo "OCR WER heavy:     ${{ needs.ocr-wer-heavy.result }}"

          if [ "${{ needs.swift-gate.result }}" != "success" ]; then
            echo "::error::Swift gate failed"
            exit 1
          fi
          if [ "${{ needs.node-contract.result }}" != "success" ]; then
            echo "::error::Node contract gate failed"
            exit 1
          fi
          if [ "${{ needs.react-doctor.result }}" != "success" ]; then
            echo "::error::React Doctor gate failed"
            exit 1
          fi
          # Web E2E and tool-dependent are advisory until suites stabilize.
          if [ "${{ needs.web-e2e.result }}" != "success" ]; then
            echo "::warning::Web E2E suite reported failures (advisory until RG-081 PASS)"
          fi
          if [ "${{ needs.tool-dependent.result }}" != "success" ]; then
            echo "::warning::Tool-dependent tests had failures (advisory — tools may be missing on runner)"
          fi
          # The heavy OCR lane only runs on schedule/manual dispatch (its job
          # has an if: guard), so on push it is skipped and must not block.
          if [ "${{ needs.ocr-wer-heavy.result }}" != "success" ] && [ "${{ needs.ocr-wer-heavy.result }}" != "skipped" ]; then
            echo "::error::OCR WER heavy gate failed — provider regression detected"
            exit 1
          fi
          echo "CI gates satisfied."
